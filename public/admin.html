<!DOCTYPE html>
<!--
  CircleChat 私人聊天 — 管理页（Vue 3 + TypeScript + Tailwind）
  仅 role=admin 的账号可访问，非管理员会被服务端与脚本双重拦截。
  界面由 src/main-admin.ts 构建出的 /dist/assets/admin.js 挂载，
  UI 样式使用 Tailwind（主题色复用 style.css 的 CSS 变量）。
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#07c160">
  <title>CircleChat · 管理面板</title>
  <link rel="icon" href="data:,">
  <link rel="icon" href="./favicon.svg">
  <!-- 共享样式：由 src/styles/tailwind.css 构建而来（两个入口共用同一份） -->
  <link rel="stylesheet" href="/dist/assets/tailwind.css">
</head>
<body>
  <div id="app"></div>

  <script src="/js/i18n.js"></script>
  <script src="/js/lang/zh.js"></script>
  <script src="/js/lang/en.js"></script>
  <script src="/js/lang/jp.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/ui.js"></script>
  <script type="module" src="/dist/assets/admin.js"></script>
</body>
</html>
