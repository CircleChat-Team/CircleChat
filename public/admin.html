<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#07c160">
  <title>ChatPlus · 管理面板</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="./favicon.svg">
</head>
<body>
  <div class="admin-view">

    <header class="admin-header">
      <div class="admin-brand">
        <button id="adminBack" class="icon-btn" title="返回聊天" aria-label="返回聊天">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"></path>
          </svg>
        </button>
        <span class="admin-title">管理面板</span>
        <span id="adminMe" class="admin-me">—</span>
      </div>
      <div class="admin-actions">
        <button id="themeBtn" class="icon-btn" title="切换深色模式" aria-label="切换深色模式">
          <svg class="icon" id="themeIcon" viewBox="0 0 24 24" aria-hidden="true"></svg>
        </button>
        <button id="logoutBtn" class="logout-btn" title="退出登录">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"></path>
          </svg>
          <span>退出</span>
        </button>
      </div>
    </header>

    <main class="admin-main">

      <section class="admin-card">
        <div class="admin-card-title log-title">
          <span>待审核注册申请<span id="approvalCount" class="admin-count"></span></span>
          <button id="approvalRefresh" class="admin-act" type="button">刷新</button>
        </div>
        <div id="approvalList" class="admin-user-list"></div>
      </section>

      <section class="admin-card">
        <div class="admin-card-title">新建账号</div>
        <div class="admin-add">
          <input id="adminNewName" class="admin-input" type="text" maxlength="20" placeholder="用户名（2-20 位）">
          <input id="adminNewPass" class="admin-input" type="password" maxlength="64" placeholder="密码（至少 6 位）">
          <button id="adminAddBtn" class="admin-btn" type="button">添加</button>
        </div>
      </section>

      <section class="admin-card">
        <div class="admin-card-title">账号列表<span id="adminCount" class="admin-count"></span></div>
        <div id="adminUserList" class="admin-user-list"></div>
      </section>

      <section class="admin-card">
        <div class="admin-card-title log-title">
          <span>审计日志<span id="logCount" class="admin-count"></span></span>
          <span class="log-tools">
            <input id="logActor" class="admin-input" type="text" maxlength="40" placeholder="按用户筛选">
            <select id="logAction" class="admin-input" title="按动作筛选">
              <option value="">全部动作</option>
              <option value="login">登录</option>
              <option value="login.fail">登录失败</option>
              <option value="logout">退出登录</option>
              <option value="msg">发送消息</option>
              <option value="recall">撤回消息</option>
              <option value="upload">上传文件</option>
              <option value="settings">修改设置</option>
              <option value="admin.user.add">新建账号</option>
              <option value="admin.user.del">删除账号</option>
              <option value="admin.user.pass">重置密码</option>
            </select>
            <button id="logRefresh" class="admin-act" type="button">刷新</button>
          </span>
        </div>
        <div id="adminLogList" class="admin-log-list"></div>
      </section>

    </main>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="/js/config.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
