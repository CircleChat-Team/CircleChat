<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#07c160">
  <title data-i18n="admin.title">ChatPlus · 管理面板</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="./favicon.svg">
</head>
<body>
  <div class="admin-view">

    <header class="admin-header">
      <div class="admin-brand">
        <button id="adminBack" class="icon-btn" title="返回聊天" data-i18n-title="admin.back" aria-label="返回聊天" data-i18n-aria="admin.back">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"></path>
          </svg>
        </button>
        <span class="admin-title" data-i18n="chat.adminPanel">管理面板</span>
        <span id="adminMe" class="admin-me">—</span>
      </div>
      <div class="admin-actions">
        <div class="lang-switch">
          <button type="button" id="langBtn" class="icon-btn" title="切换语言" aria-label="切换语言"
                  aria-haspopup="true" aria-expanded="false"
                  data-i18n-title="common.lang" data-i18n-aria="common.lang">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm6.9 6h-2.95a15.6 15.6 0 0 0-1.4-3.6A8 8 0 0 1 18.9 8zM12 4.06c.83 1.2 1.5 2.53 1.93 3.94h-3.86A14.6 14.6 0 0 1 12 4.06zM4.26 14A8.1 8.1 0 0 1 4 12c0-.69.09-1.36.26-2h3.38c-.09.66-.14 1.32-.14 2s.05 1.34.14 2H4.26zm.84 2h2.95c.34 1.28.82 2.5 1.4 3.6A8 8 0 0 1 5.1 16zm2.95-8H5.1a8 8 0 0 1 4.35-3.6A15.6 15.6 0 0 0 8.05 8zM12 19.94A14.6 14.6 0 0 1 10.07 16h3.86A14.6 14.6 0 0 1 12 19.94zM14.34 14H9.66c-.1-.66-.16-1.32-.16-2s.06-1.35.16-2h4.68c.1.65.16 1.32.16 2s-.06 1.34-.16 2zm.21 5.6c.58-1.1 1.06-2.32 1.4-3.6h2.95a8 8 0 0 1-4.35 3.6zM16.36 14c.09-.66.14-1.32.14-2s-.05-1.34-.14-2h3.38c.17.64.26 1.31.26 2s-.09 1.36-.26 2h-3.38z"></path>
            </svg>
          </button>
          <div id="langMenu" class="lang-menu hidden" role="menu"></div>
        </div>
        <button id="themeBtn" class="icon-btn" title="切换深色模式" data-i18n-title="common.theme" aria-label="切换深色模式" data-i18n-aria="common.theme">
          <svg class="icon" id="themeIcon" viewBox="0 0 24 24" aria-hidden="true"></svg>
        </button>
        <button id="logoutBtn" class="logout-btn" title="退出登录" data-i18n-title="common.logout">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"></path>
          </svg>
          <span data-i18n="chat.logoutShort">退出</span>
        </button>
      </div>
    </header>

    <main class="admin-main">

      <section class="admin-card">
        <div class="admin-card-title log-title">
          <span><span data-i18n="admin.pending">待审核注册申请</span><span id="approvalCount" class="admin-count"></span></span>
          <button id="approvalRefresh" class="admin-act" type="button" data-i18n="common.refresh">刷新</button>
        </div>
        <div id="approvalList" class="admin-user-list"></div>
      </section>

      <section class="admin-card">
        <div class="admin-card-title" data-i18n="admin.add.title">新建账号</div>
        <div class="admin-add">
          <input id="adminNewName" class="admin-input" type="text" maxlength="20" placeholder="用户名（2-20 位）" data-i18n-placeholder="admin.add.namePlaceholder">
          <input id="adminNewPass" class="admin-input" type="password" maxlength="64" placeholder="密码（至少 6 位）" data-i18n-placeholder="reg.passPlaceholder">
          <button id="adminAddBtn" class="admin-btn" type="button" data-i18n="admin.add.submit">添加</button>
        </div>
      </section>

      <section class="admin-card">
        <div class="admin-card-title"><span data-i18n="admin.users.title">账号列表</span><span id="adminCount" class="admin-count"></span></div>
        <div id="adminUserList" class="admin-user-list"></div>
      </section>

      <section class="admin-card">
        <div class="admin-card-title log-title">
          <span><span data-i18n="admin.log.title">审计日志</span><span id="logCount" class="admin-count"></span></span>
          <span class="log-tools">
            <input id="logActor" class="admin-input" type="text" maxlength="40" placeholder="按用户筛选" data-i18n-placeholder="admin.log.actorPlaceholder">
            <select id="logAction" class="admin-input" title="按动作筛选" data-i18n-title="admin.log.actionTitle">
              <option value="" data-i18n="admin.log.all">全部动作</option>
              <option value="login" data-i18n="admin.action.login">登录</option>
              <option value="login.fail" data-i18n="admin.action.loginFail">登录失败</option>
              <option value="logout" data-i18n="admin.action.logout">退出登录</option>
              <option value="msg" data-i18n="admin.action.msg">发送消息</option>
              <option value="recall" data-i18n="admin.action.recall">撤回消息</option>
              <option value="upload" data-i18n="admin.action.upload">上传文件</option>
              <option value="settings" data-i18n="admin.action.settings">修改设置</option>
              <option value="admin.user.add" data-i18n="admin.action.userAdd">新建账号</option>
              <option value="admin.user.del" data-i18n="admin.action.userDel">删除账号</option>
              <option value="admin.user.pass" data-i18n="admin.action.userPass">重置密码</option>
            </select>
            <button id="logRefresh" class="admin-act" type="button" data-i18n="common.refresh">刷新</button>
          </span>
        </div>
        <div id="adminLogList" class="admin-log-list"></div>
      </section>

    </main>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="/js/i18n.js"></script>
  <script src="/js/lang/zh.js"></script>
  <script src="/js/lang/en.js"></script>
  <script src="/js/lang/jp.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
