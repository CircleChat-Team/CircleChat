<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>ChatPlus · 登录</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="login-view">
    <div class="login-card">
      <div class="login-brand">
        <div class="login-logo">ChatPlus</div>
        <div class="login-tag">私人聊天</div>
      </div>
      <div class="login-sub">仅限受邀账号登录</div>

      <form id="loginForm" class="login-form" autocomplete="off">
        <div class="field">
          <input id="loginUser" class="login-input" type="text" placeholder="账号" maxlength="32" required>
        </div>
        <div class="field">
          <input id="loginPass" class="login-input has-toggle" type="password" placeholder="密码" maxlength="64" required>
          <button type="button" id="togglePass" class="field-toggle" aria-label="显示或隐藏密码" title="显示密码">
            <svg class="icon" id="togglePassIcon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"></path>
            </svg>
          </button>
        </div>
        <button class="login-btn" id="loginBtn" type="submit">
          <span id="loginBtnText">登 录</span>
        </button>
      </form>

      <div id="loginErr" class="login-err"></div>
      <div id="loginFooter" class="login-footer"></div>
    </div>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
