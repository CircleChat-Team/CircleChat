<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title data-i18n="login.title">ChatPlus · 登录</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="./favicon.svg">
</head>
<body>
  <!-- 右上角控制簇：登录页没有顶栏，主题与语言切换独立悬浮 -->
  <div class="login-tools">
    <button type="button" id="themeBtn" class="tool-btn" title="切换深色模式" aria-label="切换深色模式"
            data-i18n-title="common.theme" data-i18n-aria="common.theme">
      <svg class="icon" id="themeIcon" viewBox="0 0 24 24" aria-hidden="true"></svg>
    </button>
    <div class="lang-switch">
      <button type="button" id="langBtn" class="tool-btn" title="切换语言" aria-label="切换语言"
              aria-haspopup="true" aria-expanded="false"
              data-i18n-title="common.lang" data-i18n-aria="common.lang">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm6.9 6h-2.95a15.6 15.6 0 0 0-1.4-3.6A8 8 0 0 1 18.9 8zM12 4.06c.83 1.2 1.5 2.53 1.93 3.94h-3.86A14.6 14.6 0 0 1 12 4.06zM4.26 14A8.1 8.1 0 0 1 4 12c0-.69.09-1.36.26-2h3.38c-.09.66-.14 1.32-.14 2s.05 1.34.14 2H4.26zm.84 2h2.95c.34 1.28.82 2.5 1.4 3.6A8 8 0 0 1 5.1 16zm2.95-8H5.1a8 8 0 0 1 4.35-3.6A15.6 15.6 0 0 0 8.05 8zM12 19.94A14.6 14.6 0 0 1 10.07 16h3.86A14.6 14.6 0 0 1 12 19.94zM14.34 14H9.66c-.1-.66-.16-1.32-.16-2s.06-1.35.16-2h4.68c.1.65.16 1.32.16 2s-.06 1.34-.16 2zm.21 5.6c.58-1.1 1.06-2.32 1.4-3.6h2.95a8 8 0 0 1-4.35 3.6zM16.36 14c.09-.66.14-1.32.14-2s-.05-1.34-.14-2h3.38c.17.64.26 1.31.26 2s-.09 1.36-.26 2h-3.38z"></path>
        </svg>
      </button>
      <!-- 选项由 I18N.languages() 动态渲染，新增语言无需改这里 -->
      <div id="langMenu" class="lang-menu hidden" role="menu"></div>
    </div>
  </div>

  <div class="login-view">
    <div class="login-card">
      <div class="login-brand">
        <div class="login-logo">ChatPlus</div>
        <div class="login-tag" data-i18n="login.tag">私人聊天</div>
      </div>
      <div class="login-sub" data-i18n="login.sub">仅限受邀账号登录</div>

      <form id="loginForm" class="login-form" autocomplete="off">
        <div class="field">
          <input id="loginUser" class="login-input" type="text" placeholder="账号"
                 data-i18n-placeholder="login.userPlaceholder" maxlength="32" required>
        </div>
        <div class="field">
          <input id="loginPass" class="login-input has-toggle" type="password" placeholder="密码"
                 data-i18n-placeholder="login.passPlaceholder" maxlength="64" required>
          <button type="button" id="togglePass" class="field-toggle" aria-label="显示或隐藏密码"
                  title="显示密码" data-i18n-title="login.showPass" data-i18n-aria="login.togglePass">
            <svg class="icon" id="togglePassIcon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"></path>
            </svg>
          </button>
        </div>
        <button class="login-btn" id="loginBtn" type="submit">
          <span id="loginBtnText" data-i18n="login.submit">登 录</span>
        </button>
      </form>

      <div id="loginErr" class="login-err"></div>

      <button type="button" id="toggleRegister" class="login-link" data-i18n="reg.toggle">没有账号？申请注册（需管理员审核）</button>

      <form id="registerForm" class="login-form hidden" autocomplete="off">
        <div class="field">
          <input id="regUser" class="login-input" type="text" placeholder="注册账号"
                 data-i18n-placeholder="reg.userPlaceholder" maxlength="20" required>
        </div>
        <div class="field">
          <input id="regPass" class="login-input" type="password" placeholder="密码（至少 6 位）"
                 data-i18n-placeholder="reg.passPlaceholder" maxlength="64" required>
        </div>
        <div class="field">
          <input id="regPass2" class="login-input" type="password" placeholder="确认密码"
                 data-i18n-placeholder="reg.pass2Placeholder" maxlength="64" required>
        </div>
        <button class="login-btn" id="regBtn" type="submit">
          <span id="regBtnText" data-i18n="reg.submit">提交注册申请</span>
        </button>
      </form>

      <div id="registerHint" class="login-hint hidden"></div>
      <div id="loginFooter" class="login-footer"></div>
    </div>
  </div>

  <script src="/js/i18n.js"></script>
  <script src="/js/lang/zh.js"></script>
  <script src="/js/lang/en.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
