<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#07c160">
  <title>ChatPlus · 聊天</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="chatView" class="chat-view">

    <!-- 侧边栏：用户列表（桌面端常驻，移动端抽屉） -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-head">
        <div class="sidebar-brand">ChatPlus</div>
        <button id="sidebarCollapse" class="icon-btn" title="收起侧边栏" aria-label="收起侧边栏">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"></path>
          </svg>
        </button>
      </div>
      <div id="sidebarUsers" class="sidebar-list"></div>
      <div class="sidebar-foot">
        <span class="sidebar-me-label">登录身份</span>
        <span id="sidebarMe" class="sidebar-me">—</span>
      </div>
    </aside>
    <div id="sidebarBackdrop" class="sidebar-backdrop"></div>

    <!-- 主聊天区 -->
    <main class="chat-main">
      <header class="chat-header">
        <button id="sidebarToggle" class="icon-btn" title="成员列表" aria-label="成员列表">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"></path>
          </svg>
        </button>
        <div class="chat-title">
          <span class="dot" id="connDot"></span>
          <span id="chatTitle">ChatPlus</span>
        </div>
        <div class="chat-actions">
          <label class="switch" title="系统通知">
            <input type="checkbox" id="notifyToggle">
            <span class="slider"></span>
          </label>
          <button id="themeBtn" class="icon-btn" title="切换深色模式" aria-label="切换深色模式">
            <svg class="icon" id="themeIcon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.39 5.39 0 0 1-4.4 2.26 5.4 5.4 0 0 1-3.33-9.62A9.05 9.05 0 0 0 12 3z"></path>
            </svg>
          </button>
          <button id="logoutBtn" class="logout-btn" title="退出登录">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"></path>
            </svg>
            <span>退出</span>
          </button>
        </div>
      </header>

      <div id="msgList" class="msg-list"></div>

      <div id="emojiPanel" class="emoji-panel hidden"></div>

      <footer class="chat-inputbar">
        <button id="emojiBtn" class="tool-btn" title="表情" aria-label="表情">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.03 0 3.8-1.11 4.75-2.75H7.25C8.2 16.39 9.97 17.5 12 17.5z"></path>
          </svg>
        </button>
        <button id="imageBtn" class="tool-btn" title="发送图片" aria-label="发送图片">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"></path>
          </svg>
        </button>
        <button id="fileBtn" class="tool-btn" title="发送文件" aria-label="发送文件">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M16.5 6v11.5a4 4 0 1 1-8 0V5a2.5 2.5 0 0 1 5 0v10.5a1 1 0 0 1-2 0V6H10v9.5a2.5 2.5 0 0 0 5 0V5a4 4 0 0 0-8 0v12.5a5.5 5.5 0 0 0 11 0V6h-1.5z"></path>
          </svg>
        </button>
        <input id="fileInput" type="file" hidden>
        <input id="textInput" class="text-input" type="text" placeholder="输入消息…" maxlength="4096" autocomplete="off">
        <button id="sendBtn" class="send-btn" title="发送" aria-label="发送">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
          </svg>
          <span>发送</span>
        </button>
      </footer>
    </main>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="/js/config.js"></script>
  <script src="/js/chat.js"></script>
</body>
</html>
