<!DOCTYPE html>
<!--
  CircleChat 私人聊天 — 聊天页（Vue 3 + TypeScript + Tailwind）
  界面由 src/main-chat.ts 构建出的 /dist/assets/chat.js 挂载，
  主聊天样式现由 src/styles/chat.css 经入口打包（与 Tailwind 页面共用同一套 CSS 变量）。
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#07c160">
  <title>CircleChat · 聊天</title>
  <link rel="stylesheet" href="/dist/assets/tailwind.css">
  <style>#app{height:100%}</style>
  <link rel="icon" href="./favicon.svg?v=2">
</head>
<body>
  <div id="app"></div>

  <script src="/js/config.js"></script>
  <!-- 代码高亮(highlight.js) 与数学公式(MathJax) 已改为 npm 依赖，随 chat.js 打包 -->
  <script type="module" src="/dist/assets/chat.js"></script>
</body>
</html>
