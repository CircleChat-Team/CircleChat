<!DOCTYPE html>
<!--
  ChatPlus 私人聊天 — 聊天页（Vue 3 + TypeScript + Tailwind）
  界面由 src/main-chat.ts 构建出的 /dist/assets/chat.js 挂载，
  主聊天样式复用 /css/style.css，弹层使用 Tailwind（主题色复用同一套变量）。
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#07c160">
  <title>ChatPlus · 聊天</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/dist/assets/tailwind.css">
  <link rel="stylesheet" href="/css/chat-vue.css">
  <style>#app{height:100%}</style>
  <link rel="icon" href="./favicon.svg">
</head>
<body>
  <div id="app"></div>

  <!-- 先加载 i18n（提供 window.I18N，含 chat.* 文案）与配置，再挂载 Vue 应用 -->
  <script src="/js/i18n.js"></script>
  <script src="/js/lang/zh.js"></script>
  <script src="/js/lang/en.js"></script>
  <script src="/js/lang/jp.js"></script>
  <script src="/js/config.js"></script>
  <!-- 代码高亮（本地自托管，无 CDN）：由 npm run build:hljs 生成 -->
  <script src="/vendor/highlight.min.js?v=11.12.0"></script>
  <script type="module" src="/dist/assets/chat.js"></script>
</body>
</html>
